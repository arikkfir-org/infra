# Reads the credentials of the task's root (env ROOT) from Secret Manager, as the pipeline's identity, into the task's
# memory volume (scripts/credentials.sh). Octomaton inlines it into each step that references it by name.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: credentials
spec:
  params:
    - name: identity
      type: string
      description: The pipeline's identity, plan or apply, which picks the root's GitHub token or Keycloak secret.
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
  env:
    - name: IDENTITY
      value: $(params.identity)
  command: [sh, .tekton/scripts/credentials.sh]
