# Merges to main: plans gcp, github, keycloak and namecheap as ci-infra-apply and Keycloak's client terraform-apply,
# and applies each saved plan, in a task per root (apply.task.yaml): gcp and github at once, then keycloak, which writes
# secrets gcp creates, and namecheap, which reads the DNS zones gcp creates
# (docs/infra/designs/terraform-plan-apply.md).
# ci-infra-apply carries octomaton.dev/branches: main, so Octomaton refuses to run this anywhere else.
# Octomaton sets spec.params (repo-url, revision) from .octomaton.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: infra-apply-
spec:
  taskRunTemplate:
    serviceAccountName: ci-infra-apply
  # Reserved once for all of a task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: gcp
      computeResources: &resources
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi
    - pipelineTaskName: github
      computeResources: *resources
    - pipelineTaskName: keycloak
      computeResources: *resources
    - pipelineTaskName: namecheap
      computeResources: *resources
  timeouts:
    pipeline: 1h
  # An emptyDir: each task's pod gets its own, so every task clones the commit itself.
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Clone URL of the repository.
      - name: revision
        type: string
        description: Commit SHA to apply.
    workspaces:
      - name: source
    # Tekton leaves these out when a root's task fails; each root's own check (taskChecks in .octomaton.yaml) still
    # shows its plan.
    results:
      - name: check-title
        value: >-
          $(tasks.gcp.results.check-title); $(tasks.github.results.check-title);
          $(tasks.keycloak.results.check-title); $(tasks.namecheap.results.check-title)
      - name: check-summary
        value: |-
          $(tasks.gcp.results.check-summary)

          $(tasks.github.results.check-summary)

          $(tasks.keycloak.results.check-summary)

          $(tasks.namecheap.results.check-summary)
    tasks:
      - name: gcp
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: gcp
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: apply # .tekton/apply.task.yaml
      - name: github
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: github
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: apply # .tekton/apply.task.yaml
      - name: keycloak
        runAfter:
          - gcp
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: keycloak
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: apply # .tekton/apply.task.yaml
      - name: namecheap
        runAfter:
          - gcp
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: namecheap
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: apply # .tekton/apply.task.yaml
