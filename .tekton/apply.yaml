# Merges to main: plans gcp, github and keycloak as ci-infra-apply and Keycloak's client terraform-apply, and
# applies the saved plans in that order (see the hub reference, "Terraform applies"). ci-infra-apply carries octomaton.dev/branches: main, so Octomaton refuses to run
# this anywhere else.
# Octomaton sets spec.params (repo-url, revision) from .octomaton.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: infra-apply-
spec:
  taskRunTemplate:
    serviceAccountName: ci-infra-apply
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: terraform
      computeResources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
  timeouts:
    pipeline: 1h
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Clone URL of the repository.
      - name: revision
        type: string
        description: Commit SHA to apply.
    workspaces:
      - name: source
    results:
      - name: check-title
        value: $(tasks.terraform.results.check-title)
      - name: check-summary
        value: $(tasks.terraform.results.check-summary)
    tasks:
      - name: terraform
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          results:
            - name: check-title
              type: string
            - name: check-summary
              type: string
          # The GitHub token and the Keycloak client secret, in memory, for this task's steps only.
          volumes:
            - name: credentials
              emptyDir:
                medium: Memory
            # Terraform's provider cache. init links .terraform/providers into it, so every step that runs terraform
            # must see the same cache, not its own container's /tmp.
            - name: terraform-plugins
              emptyDir: {}
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: TF_IN_AUTOMATION
                value: "true"
              - name: TF_PLUGIN_CACHE_DIR
                value: /tmp/terraform-plugins
            volumeMounts:
              - name: credentials
                mountPath: /var/run/credentials
              - name: terraform-plugins
                mountPath: /tmp/terraform-plugins
          # plan-summary.py sizes its results for a pod of at most 10 containers: three init containers and the steps.
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet FETCH_HEAD
            - name: token
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                umask 077
                gcloud secrets versions access latest --secret=infra-apply-github-pat --project=arikkfir \
                  > /var/run/credentials/github-token
                gcloud secrets versions access latest --secret=infra-apply-keycloak-secret --project=arikkfir \
                  > /var/run/credentials/keycloak-secret
            - name: plan
              image: hashicorp/terraform:1.16.4
              env:
                - name: KEYCLOAK_CLIENT_ID
                  value: terraform-apply
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
                GITHUB_TOKEN="$(cat /var/run/credentials/github-token)"
                KEYCLOAK_CLIENT_SECRET="$(cat /var/run/credentials/keycloak-secret)"
                export GITHUB_TOKEN KEYCLOAK_CLIENT_SECRET
                for root in gcp github keycloak; do
                  echo "==> terraform/${root}"
                  terraform -chdir="terraform/${root}" init -input=false
                  terraform -chdir="terraform/${root}" plan -input=false -lock-timeout=10m -out="${root}.tfplan"
                  terraform -chdir="terraform/${root}" show -json "${root}.tfplan" > "${root}.plan.json"
                done
            - name: summary
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                python3 .tekton/plan-summary.py --title "$(results.check-title.path)" \
                  --summary "$(results.check-summary.path)" gcp=gcp.plan.json github=github.plan.json \
                  keycloak=keycloak.plan.json
            # A saved plan applies only if the state hasn't changed since it was made.
            - name: apply
              image: hashicorp/terraform:1.16.4
              env:
                - name: KEYCLOAK_CLIENT_ID
                  value: terraform-apply
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
                GITHUB_TOKEN="$(cat /var/run/credentials/github-token)"
                KEYCLOAK_CLIENT_SECRET="$(cat /var/run/credentials/keycloak-secret)"
                export GITHUB_TOKEN KEYCLOAK_CLIENT_SECRET
                for root in gcp github keycloak; do
                  echo "==> terraform/${root}"
                  terraform -chdir="terraform/${root}" apply -input=false -lock-timeout=10m "${root}.tfplan"
                done
                printf 'Applied: %s' "$(cat "$(results.check-title.path)")" > "$(results.check-title.path)"
