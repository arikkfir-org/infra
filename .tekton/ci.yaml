# Pull requests and the merge queue: checks formatting and validates every root (task check, check.task.yaml), and
# plans gcp, github, keycloak and namecheap in a task each (plan.task.yaml), all at once, as the ServiceAccount
# ci-infra-plan (read-only GCP roles) and Keycloak's client terraform-plan (view roles), without taking the state lock
# (docs/infra/designs/terraform-plan-apply.md).
# Octomaton sets spec.params (repo-url, revision) from .octomaton.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: infra-ci-
spec:
  taskRunTemplate:
    serviceAccountName: ci-infra-plan
  # Reserved once for all of a task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: check
      computeResources: &resources
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi
    - pipelineTaskName: gcp
      computeResources: *resources
    - pipelineTaskName: github
      computeResources: *resources
    - pipelineTaskName: keycloak
      computeResources: *resources
    - pipelineTaskName: namecheap
      computeResources: *resources
  timeouts:
    pipeline: 30m
  # An emptyDir: each task's pod gets its own, so every task clones the commit itself.
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Clone URL of the repository.
      - name: revision
        type: string
        description: Commit SHA to check.
    workspaces:
      - name: source
    # Tekton leaves these out when a root's task fails; each root's own check (taskChecks in .octomaton.yaml) still
    # shows its plan.
    results:
      - name: check-title
        value: >-
          $(tasks.gcp.results.check-title); $(tasks.github.results.check-title);
          $(tasks.keycloak.results.check-title); $(tasks.namecheap.results.check-title)
      - name: check-summary
        value: |-
          $(tasks.gcp.results.check-summary)

          $(tasks.github.results.check-summary)

          $(tasks.keycloak.results.check-summary)

          $(tasks.namecheap.results.check-summary)
    tasks:
      - name: check
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: check # .tekton/check.task.yaml
      - name: gcp
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: gcp
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: plan # .tekton/plan.task.yaml
      - name: github
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: github
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: plan # .tekton/plan.task.yaml
      - name: keycloak
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: keycloak
          # Keycloak shows a client's secret only to client managers, and its provider reads the secret to refresh a
          # client, so keycloak's plan compares the code with the state alone.
          - name: refresh
            value: "false"
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: plan # .tekton/plan.task.yaml
      - name: namecheap
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: root
            value: namecheap
        workspaces:
          - name: source
            workspace: source
        taskRef:
          name: plan # .tekton/plan.task.yaml
