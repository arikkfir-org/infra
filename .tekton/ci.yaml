# Pull requests and the merge queue: checks formatting, validates every root, and plans gcp and github as the
# ServiceAccount ci-infra-plan (read-only GCP roles), without taking the state lock (see the hub reference,
# "Terraform applies").
# Octomaton sets spec.params (repo-url, revision) from .octomaton.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: infra-ci-
spec:
  taskRunTemplate:
    serviceAccountName: ci-infra-plan
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: terraform
      computeResources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
  timeouts:
    pipeline: 30m
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Clone URL of the repository.
      - name: revision
        type: string
        description: Commit SHA to check.
    workspaces:
      - name: source
    results:
      - name: check-title
        value: $(tasks.terraform.results.check-title)
      - name: check-summary
        value: $(tasks.terraform.results.check-summary)
    tasks:
      - name: terraform
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          results:
            - name: check-title
              type: string
            - name: check-summary
              type: string
          # The GitHub token, in memory, for this task's steps only.
          volumes:
            - name: github
              emptyDir:
                medium: Memory
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: TF_IN_AUTOMATION
                value: "true"
              - name: TF_PLUGIN_CACHE_DIR
                value: /tmp/terraform-plugins
            volumeMounts:
              - name: github
                mountPath: /var/run/github
          # plan-summary.py sizes its results for a pod of at most 10 containers: three init containers and the steps.
          steps:
            - name: clone
              image: alpine/git:2.54.0
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet FETCH_HEAD
            - name: test
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                python3 -m unittest discover -s tests
            - name: fmt
              image: hashicorp/terraform:1.16.4
              script: |
                #!/bin/sh
                set -eu
                terraform fmt -check -recursive -diff
            - name: validate
              image: hashicorp/terraform:1.16.4
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
                for root in terraform/gcp terraform/argocd terraform/github; do
                  echo "==> ${root}"
                  terraform -chdir="${root}" init -backend=false -input=false
                  terraform -chdir="${root}" validate
                done
            - name: token
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                umask 077
                gcloud secrets versions access latest --secret=infra-plan-github-pat --project=arikkfir \
                  > /var/run/github/token
            - name: plan
              image: hashicorp/terraform:1.16.4
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
                GITHUB_TOKEN="$(cat /var/run/github/token)"
                export GITHUB_TOKEN
                for root in gcp github; do
                  echo "==> terraform/${root}"
                  terraform -chdir="terraform/${root}" init -input=false
                  terraform -chdir="terraform/${root}" plan -input=false -lock=false -out="${root}.tfplan"
                  terraform -chdir="terraform/${root}" show -json "${root}.tfplan" > "${root}.plan.json"
                done
            - name: summary
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                python3 .tekton/plan-summary.py --title "$(results.check-title.path)" \
                  --summary "$(results.check-summary.path)" gcp=gcp.plan.json github=github.plan.json
