# Checks formatting and validates every Terraform root without credentials or state access.
# Octomatron sets spec.params (repo-url, revision) from .octomatron.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: infra-ci-
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 30m
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
        description: Clone URL of the repository.
      - name: revision
        type: string
        description: Commit SHA to check.
    workspaces:
      - name: source
    tasks:
      - name: terraform
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: source
          steps:
            - name: clone
              image: alpine/git:2.54.0
              workingDir: $(workspaces.source.path)
              env:
                - name: REPO_URL
                  value: $(params.repo-url)
                - name: REVISION
                  value: $(params.revision)
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet FETCH_HEAD
            - name: fmt
              image: hashicorp/terraform:1.16.4
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                terraform fmt -check -recursive -diff
            - name: validate
              image: hashicorp/terraform:1.16.4
              workingDir: $(workspaces.source.path)
              env:
                - name: TF_IN_AUTOMATION
                  value: "true"
                - name: TF_PLUGIN_CACHE_DIR
                  value: /tmp/terraform-plugins
              computeResources:
                requests:
                  cpu: 500m
                  memory: 1Gi
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
                for root in terraform/gcp terraform/github; do
                  echo "==> ${root}"
                  terraform -chdir="${root}" init -backend=false -input=false
                  terraform -chdir="${root}" validate
                done
